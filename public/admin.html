<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1c1b19">
<title>Venue editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&family=Libre+Franklin:wght@400;500;600&family=Playfair+Display:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
  :root { --ink: #1c1b19; --muted: #6f6a62; --line: #e6e3dd; --soft: #f3f1ec; --ok: #1d7a3e; --okbg: #e6f4ea; --warn: #8a5a00; --warnbg: #fff3d6; --bad: #9a2a1a; --badbg: #fde4e0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9e6e0; color: var(--ink); font: 16px/1.45 'DM Sans', system-ui, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid #2d6cdf; outline-offset: 2px; }
  .app { max-width: 560px; margin: 0 auto; min-height: 100vh; background: #fff; padding-bottom: calc(84px + env(safe-area-inset-bottom)); box-shadow: 0 0 40px rgba(0,0,0,.08); }
  header.top { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
  header.top h1 { margin: 0; font-size: 20px; letter-spacing: -0.01em; flex: 1; }
  header.top a { font-size: 14px; font-weight: 700; color: var(--ink); }
  main { padding: 20px; }
  h2 { font-size: 26px; letter-spacing: -0.02em; margin: 4px 0 14px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 26px 0 8px; }
  .muted { color: var(--muted); font-size: 14px; }
  .card { background: var(--soft); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 99px; padding: 4px 10px; }
  .pill.ok { background: var(--okbg); color: var(--ok); } .pill.warn { background: var(--warnbg); color: var(--warn); } .pill.bad { background: var(--badbg); color: var(--bad); } .pill.plain { background: #ebe8e2; color: var(--ink); }
  .btn { min-height: 48px; border-radius: 14px; border: 2px solid var(--ink); background: #fff; padding: 0 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: var(--ink); }
  .btn.dark { background: var(--ink); color: #fff; }
  .btn.lime { background: #c6ff3d; border-color: #c6ff3d; }
  .btn.danger { border-color: var(--bad); color: var(--bad); }
  .btn.block { width: 100%; }
  .btn.small { min-height: 40px; font-size: 14px; border-radius: 99px; padding: 0 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
  .quick button { min-height: 88px; border: 0; border-radius: 16px; background: var(--soft); text-align: left; padding: 14px; font-weight: 700; display: flex; flex-direction: column; justify-content: space-between; }
  .quick button.dark { background: var(--ink); color: #fff; }
  .quick button span:first-child { font-size: 22px; line-height: 1; }
  .row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .row .grow { flex: 1; min-width: 0; }
  .row b { display: block; }
  .datebox { flex: 0 0 52px; text-align: center; background: var(--soft); border-radius: 12px; padding: 6px 0; font-size: 11px; font-weight: 700; line-height: 1.2; text-transform: uppercase; }
  .datebox span { display: block; font-size: 18px; }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid #cfccc5; background: #fff; font-size: 20px; }
  .stepper output { width: 56px; text-align: center; font-weight: 700; }
  .toggle { min-width: 92px; height: 44px; border-radius: 99px; border: 0; font-size: 13px; font-weight: 700; }
  .toggle.on { background: var(--okbg); color: var(--ok); } .toggle.off { background: var(--badbg); color: var(--bad); }
  label.f { display: grid; gap: 6px; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 14px; }
  label.f input, label.f select, label.f textarea { min-height: 48px; border: 1px solid #cfccc5; border-radius: 12px; padding: 10px 14px; font-size: 16px; color: var(--ink); background: #fff; font-weight: 400; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chips button { min-height: 44px; border-radius: 99px; border: 1px solid #cfccc5; background: #fff; padding: 0 14px; font-weight: 600; }
  .chips button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  nav.tabs { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 560px; background: #fff; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(6, 1fr); padding-bottom: env(safe-area-inset-bottom); z-index: 6; }
  nav.tabs button { border: 0; background: none; min-height: 64px; font-size: 11px; font-weight: 700; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; }
  nav.tabs button span { font-size: 20px; line-height: 1; }
  nav.tabs button.on { color: var(--ink); }
  nav.tabs .badge { position: absolute; top: 8px; right: calc(50% - 20px); background: var(--bad); color: #fff; border-radius: 99px; font-size: 10px; padding: 1px 6px; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: #fff; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 20px 20px calc(24px + env(safe-area-inset-bottom)); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .sheet-head h2 { margin: 0; }
  .x { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--soft); font-size: 20px; }
  .tp { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
  .tp span { font-size: 13px; font-weight: 600; border-radius: 99px; padding: 5px 10px; }
  .tp .a { background: var(--okbg); color: var(--ok); } .tp .s { background: var(--warnbg); color: var(--warn); }
  .err { background: var(--badbg); color: var(--bad); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-weight: 600; }
  .toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: #fff; border-radius: 99px; padding: 12px 18px; font-weight: 700; z-index: 30; max-width: 90vw; text-align: center; }
  .photo-drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 140px; border: 2px dashed #a8a49b; border-radius: 16px; background: #faf9f6; text-align: center; padding: 12px; cursor: pointer; }
  .photo-drop img { max-height: 180px; border-radius: 10px; }
  .dj { display: grid; grid-template-columns: 1fr 96px 44px; gap: 8px; margin-bottom: 8px; }
  .dj input { min-height: 48px; border: 1px solid #cfccc5; border-radius: 12px; padding: 0 12px; font-size: 16px; }
  .dj button { border: 0; background: var(--soft); border-radius: 12px; font-size: 18px; }
  .looks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .looks button { border: 3px solid transparent; border-radius: 16px; padding: 0; overflow: hidden; text-align: left; background: none; }
  .looks button.on { border-color: var(--ink); }
  .looks .sw { height: 90px; padding: 12px; display: flex; flex-direction: column; justify-content: flex-end; font-size: 22px; line-height: 1; }
  .looks .nm { padding: 8px 12px; font-weight: 700; font-size: 14px; background: #fff; }
  .day { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .day .times { display: flex; gap: 6px; align-items: center; }
  .day input[type=time] { min-height: 44px; border: 1px solid #cfccc5; border-radius: 10px; padding: 0 8px; font-size: 15px; width: 100%; }
  .canvas-wrap { display: grid; grid-template-columns: 1.2fr 1fr; gap: 10px; align-items: start; margin: 10px 0; }
  .canvas-wrap canvas { width: 100%; height: auto; border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
  textarea.caption { width: 100%; min-height: 150px; border: 1px solid #cfccc5; border-radius: 12px; padding: 12px; font-size: 15px; }
  .login { padding: 48px 24px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 id="title">Venue editor</h1>
    <a id="viewSite" href="/" target="_blank" rel="noopener">View site ↗</a>
  </header>
  <main id="view"><p class="muted">Loading…</p></main>
</div>
<nav class="tabs hidden" id="tabs" aria-label="Sections">
  <button data-tab="today" class="on"><span>◉</span>Today</button>
  <button data-tab="nights"><span>☾</span>Nights</button>
  <button data-tab="menu"><span>≡</span>Menu</button>
  <button data-tab="hours"><span>◷</span>Hours</button>
  <button data-tab="inbox"><span>✉</span>Inbox</button>
  <button data-tab="more"><span>⋯</span>More</button>
</nav>
<div id="sheet"></div>
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
<script src="/admin.js?v=3"></script>
</body>
</html>
